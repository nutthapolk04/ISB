# Build kiosk APKs for all devices in kiosk/scripts/kiosk-release-matrix.json.
#
# OPTIONAL — only if you use GitHub Actions. For local builds use:
#   cd kiosk && npm run release
#
# Version is bumped ONCE per workflow run (optional input), then both device APKs
# share the same semver / versionCode — only env credentials differ per matrix row.
#
# Required GitHub secrets (repository settings):
#   KIOSK_BUILD_API_URL          — VITE_API_URL (e.g. https://campuscard.isb.ac.th/api/v1)
#   KIOSK_BUILD_01_USERNAME      — device 1 service account
#   KIOSK_BUILD_01_PASSWORD
#   KIOSK_BUILD_02_USERNAME      — device 2 service account
#   KIOSK_BUILD_02_PASSWORD
#
# Optional (release signing — otherwise debug APK is produced):
#   ANDROID_KEYSTORE_BASE64
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# Upload kiosk-release/ artifacts to ISB_PHOTO_DIR on the server (SFTP) after each release.

name: Kiosk Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Bump package.json once for this release (applies to all devices)
        type: choice
        options:
          - none
          - patch
          - minor
          - major
        default: none
  push:
    tags:
      - 'kiosk/v*'

concurrency:
  group: kiosk-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      version_code: ${{ steps.meta.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: kiosk/package-lock.json

      - name: Set version from git tag
        if: startsWith(github.ref, 'refs/tags/kiosk/v')
        working-directory: kiosk
        run: |
          VERSION="${GITHUB_REF#refs/tags/kiosk/v}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.argv[1];
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('Set version from tag:', process.argv[1]);
          " "$VERSION"

      - name: Bump semver (once per workflow)
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        working-directory: kiosk
        run: node scripts/bump-version.mjs "${{ inputs.bump }}"

      - name: Sync Android versionCode from package.json
        working-directory: kiosk
        run: node scripts/sync-android-version.mjs

      - name: Export version metadata
        id: meta
        working-directory: kiosk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CODE=$(node -e "
            const v = require('./package.json').version.split('.').map(Number);
            console.log(v[0]*10000 + v[1]*100 + v[2]);
          ")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Upload versioned package metadata
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-version-metadata
          path: |
            kiosk/package.json
            kiosk/android/app/build.gradle

  build:
    name: Build ${{ matrix.slug }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: prod-01
            apk_filename: kiosk-prod-01.apk
            kiosk_username: kiosk_service
            username_secret: KIOSK_BUILD_01_USERNAME
            password_secret: KIOSK_BUILD_01_PASSWORD
          - slug: prod-02
            apk_filename: kiosk-prod-02.apk
            kiosk_username: kiosk_service_2
            username_secret: KIOSK_BUILD_02_USERNAME
            password_secret: KIOSK_BUILD_02_PASSWORD
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: kiosk-version-metadata
          path: kiosk-version-metadata

      - name: Apply release version from prepare job
        run: |
          cp kiosk-version-metadata/package.json kiosk/package.json
          cp kiosk-version-metadata/build.gradle kiosk/android/app/build.gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            kiosk/package-lock.json
            plugins/capacitor-hardware/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install capacitor-hardware
        working-directory: plugins/capacitor-hardware
        run: npm ci && npm run build

      - name: Install kiosk dependencies
        working-directory: kiosk
        run: npm ci

      - name: Sync Android version from package.json
        working-directory: kiosk
        run: node scripts/sync-android-version.mjs

      - name: Write device .env
        working-directory: kiosk
        env:
          VITE_API_URL: ${{ secrets.KIOSK_BUILD_API_URL }}
          VITE_KIOSK_USERNAME: ${{ secrets[matrix.username_secret] }}
          VITE_KIOSK_PASSWORD: ${{ secrets[matrix.password_secret] }}
          VITE_KIOSK_APK_FILENAME: ${{ matrix.apk_filename }}
        run: |
          cat > .env <<EOF
          VITE_API_URL=${VITE_API_URL}
          VITE_KIOSK_USERNAME=${VITE_KIOSK_USERNAME}
          VITE_KIOSK_PASSWORD=${VITE_KIOSK_PASSWORD}
          VITE_KIOSK_APK_FILENAME=${VITE_KIOSK_APK_FILENAME}
          EOF

      - name: Decode release keystore (optional)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: kiosk/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Write keystore.properties (optional)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: kiosk/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Build web assets
        working-directory: kiosk
        run: npm run build

      - name: Capacitor sync Android
        working-directory: kiosk
        run: npx cap sync android

      - name: Assemble APK
        working-directory: kiosk/android
        run: |
          if [ -f keystore.properties ]; then
            ./gradlew :app:assembleRelease --no-daemon
            APK_PATH="app/build/outputs/apk/release/app-release.apk"
          else
            ./gradlew :app:assembleDebug --no-daemon
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          fi
          mkdir -p ../dist-apk
          cp "$APK_PATH" "../dist-apk/${{ matrix.apk_filename }}"

      - uses: actions/upload-artifact@v4
        with:
          name: kiosk-apk-${{ matrix.slug }}
          path: kiosk/dist-apk/${{ matrix.apk_filename }}
          if-no-files-found: error

  package:
    name: Package release bundle
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: kiosk-version-metadata
          path: kiosk-version-metadata

      - name: Apply release version for manifest
        run: cp kiosk-version-metadata/package.json kiosk/package.json

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: kiosk-apk-*
          merge-multiple: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Write kiosk-release.json manifest
        run: |
          mkdir -p kiosk-release
          shopt -s nullglob
          for apk in release-artifacts/**/*.apk release-artifacts/*.apk; do
            cp "$apk" kiosk-release/
          done
          node kiosk/scripts/write-release-manifest.mjs kiosk-release --build-id "${{ github.run_id }}"

      - uses: actions/upload-artifact@v4
        with:
          name: kiosk-release-bundle
          path: kiosk-release/
          if-no-files-found: error
